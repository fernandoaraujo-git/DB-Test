<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CRUD Node + MariaDB</title>
    <style>
        body { background: #121212; color: #fff; font-family: monospace; padding: 20px; }
        input, button { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px; margin: 5px 0; display: block; width: 300px; }
        button { cursor: pointer; font-weight: bold; }
        button:hover { background: #0f0; color: #000; }
        pre { background: #000; padding: 10px; border-left: 3px solid #0f0; }
    </style>
</head>
<body>
    <h2>💀 Criar Usuário</h2>
    <form id="formCadastro">
        <input type="text" id="nome" placeholder="Nome" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">Cadastrar</button>
    </form>

    <h2>📜 Usuários Cadastrados</h2>
    <button onclick="carregarUsuarios()">Atualizar Lista</button>
    <pre id="output">{}</pre>

    <script>
        const API_URL = 'http://localhost:3000/usuarios';

        // POST - Injetar dado via Fetch API
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (res.ok) {
                    alert('Usuário criado com sucesso!');
                    carregarUsuarios(); // Reload na tabela
                } else {
                    alert('Erro: ' + data.erro);
                }
            } catch (err) {
                console.error('🚩 Falha na requisição:', err);
            }
        });

        // GET - Puxar os dados do banco
        async function carregarUsuarios() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                // Renderiza o JSON cru na tela pra debuggar rápido
                document.getElementById('output').textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('output').textContent = 'Erro de conexão com o Backend.';
            }
        }

        // Carrega automático no boot
        carregarUsuarios();
    </script>
</body>
</html>
